name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'server/**'
      - 'BabyMonster/Logic/GrowthReference.generated.swift'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - 'server/**'
      - 'BabyMonster/Logic/GrowthReference.generated.swift'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 兩平台的 WHO 參考資料都由 data/who-growth-reference.json 產生。
      # 任一邊被手改，這一步就會失敗，避免 web 與 iOS 的百分位算出不同答案。
      - name: 生長曲線參考資料與產出一致
        working-directory: .
        run: node scripts/generate-growth-reference.mjs --check
      - run: npm ci
      - run: npm test
      - run: npm run build

  # server/ 有自己的 package.json 與 lockfile，而上面每一步都是 working-directory: web，
  # 所以 paths 加了 server/** 之後還要有這個 job，否則伺服器的測試一行也不會跑。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 共用向量檔（shared/tests/fixtures/validateVectors.json）兩邊都跑：
      # 只在一邊放寬規則，CI 就會紅
      - run: npm test
