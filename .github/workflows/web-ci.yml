name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'server/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - 'server/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # WHO 參考資料由 data/who-growth-reference.json 產生。
      # 產出檔被手改，這一步就會失敗。
      - name: 生長曲線參考資料與產出一致
        working-directory: .
        run: node scripts/generate-growth-reference.mjs --check
      - run: npm ci
      - run: npm test
      # functions/ 不在主 tsconfig 的 include 裡（npm run build 的 tsc --noEmit 檢查不到），
      # 少了這一步，那支唯一擋在公開網路與家裡伺服器之間的程式就沒有任何型別檢查。
      - run: npm run typecheck:functions
      - run: npm run build

  # server/ 有自己的 package.json 與 lockfile，而上面每一步都是 working-directory: web，
  # 所以 paths 加了 server/** 之後還要有這個 job，否則伺服器的測試一行也不會跑。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 共用向量檔（shared/tests/fixtures/validateVectors.json）兩邊都跑：
      # 只在一邊放寬規則，CI 就會紅
      - run: npm test
